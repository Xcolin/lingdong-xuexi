spring:
  datasource:
    url: jdbc:h2:mem:lingdong_learning;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple
  # 测试隔离：不继承主配置的真实远程 Redis。端口 1 为保留端口、必然连接拒绝，
  # 保证健康探测 redis=false（503 DEGRADED）断言稳定，不依赖外部环境可达性；短超时避免拖慢测试。
  data:
    redis:
      host: 127.0.0.1
      port: 1
      timeout: 500ms
      connect-timeout: 500ms

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

lingdong:
  student-import:
    scheduling-enabled: false
    credential-key-version: v1
    credential-key: c3R1ZGVudC1pbXBvcnQtdGVzdC1rZXktMzItYnl0ZSE=
  export-job:
    scheduling-enabled: false
    source-hmac-secret: export-source-test-secret-with-at-least-32-bytes
  task-overdue:
    scheduling-enabled: false
  task-defer:
    scheduling-enabled: false
  attachment:
    local-root: ${java.io.tmpdir}/lingdong-learning-test-attachments
    cleanup:
      scheduling-enabled: false
  recurring-task:
    scheduling-enabled: false
  point-lifecycle:
    scheduling-enabled: false
  parent-account-finalization:
    scheduling-enabled: false
  reward-exchange:
    cleanup:
      scheduling-enabled: false
  auth:
    parent-sms:
      hmac-secret: parent-sms-test-secret-with-at-least-32-bytes
    student-code:
      active-key-version: v1
      keys:
        v1: c3R1ZGVudC1jb2RlLXRlc3Qta2V5LXdpdGgtMzItYnl0ZXMtbWluaW11bQ==
