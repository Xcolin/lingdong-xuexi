spring:
  datasource:
    # 测试库为 MySQL（与生产同引擎），迁移脚本无需为 H2 维护双语法；
    # CI 通过 mysql service 容器提供 root/root，本地验证通过环境变量指向专用测试库。
    url: jdbc:mysql://${LINGDONG_TEST_DB_HOST:127.0.0.1}:${LINGDONG_TEST_DB_PORT:3306}/${LINGDONG_TEST_DB_NAME:lingdong_test}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${LINGDONG_TEST_DB_USER:root}
    password: ${LINGDONG_TEST_DB_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple
  # 测试隔离：不继承主配置的真实远程 Redis。端口 1 为保留端口、必然连接拒绝，
  # 保证健康探测 redis=false（503 DEGRADED）断言稳定，不依赖外部环境可达性；短超时避免拖慢测试。
  data:
    redis:
      host: 127.0.0.1
      port: 1
      timeout: 500ms
      connect-timeout: 500ms

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

lingdong:
  student-import:
    scheduling-enabled: false
    credential-key-version: v1
    credential-key: c3R1ZGVudC1pbXBvcnQtdGVzdC1rZXktMzItYnl0ZSE=
  export-job:
    scheduling-enabled: false
    source-hmac-secret: export-source-test-secret-with-at-least-32-bytes
  task-overdue:
    scheduling-enabled: false
  task-defer:
    scheduling-enabled: false
  attachment:
    local-root: ${java.io.tmpdir}/lingdong-learning-test-attachments
    cleanup:
      scheduling-enabled: false
  recurring-task:
    scheduling-enabled: false
  point-lifecycle:
    scheduling-enabled: false
  parent-account-finalization:
    scheduling-enabled: false
  reward-exchange:
    cleanup:
      scheduling-enabled: false
  auth:
    parent-sms:
      hmac-secret: parent-sms-test-secret-with-at-least-32-bytes
    student-code:
      active-key-version: v1
      keys:
        v1: c3R1ZGVudC1jb2RlLXRlc3Qta2V5LXdpdGgtMzItYnl0ZXMtbWluaW11bQ==
