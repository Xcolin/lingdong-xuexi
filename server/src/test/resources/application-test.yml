spring:
  datasource:
    url: jdbc:h2:mem:lingdong_learning;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
