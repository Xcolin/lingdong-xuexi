spring:
  datasource:
    url: jdbc:h2:mem:lingdong_learning;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

lingdong:
  task-overdue:
    scheduling-enabled: false
  task-defer:
    scheduling-enabled: false
  attachment:
    local-root: ${java.io.tmpdir}/lingdong-learning-test-attachments
  recurring-task:
    scheduling-enabled: false
  point-lifecycle:
    scheduling-enabled: false
  reward-exchange:
    cleanup:
      scheduling-enabled: false
  auth:
    student-code:
      active-key-version: v1
      keys:
        v1: c3R1ZGVudC1jb2RlLXRlc3Qta2V5LXdpdGgtMzItYnl0ZXMtbWluaW11bQ==
