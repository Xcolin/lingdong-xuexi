spring:
  application:
    name: lingdong-learning
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/lingdong_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
    cache-names: dictionary-items
    redis:
      time-to-live: ${DICTIONARY_CACHE_TTL:PT10M}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

wx:
  app-id: ${WX_APP_ID:}
  app-secret: ${WX_APP_SECRET:}
