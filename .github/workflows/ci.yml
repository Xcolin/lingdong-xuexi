name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    name: 后端测试与打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 全量测试与打包
        run: mvn -B -DforkCount=0 package
        working-directory: lingdong-bansui-server
      - name: Flyway 迁移校验
        run: mvn -B -Dtest=FlywayMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test
        working-directory: lingdong-bansui-server
      - name: JAR 本地配置检查
        run: pwsh -File tools/check-release.ps1 -ArtifactOnly

  web:
    name: Web 类型检查、测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lingdong-bansui-web/package-lock.json
      - run: npm ci
        working-directory: lingdong-bansui-web
      - run: npm run typecheck
        working-directory: lingdong-bansui-web
      - run: npm test
        working-directory: lingdong-bansui-web
      - run: npm run build
        working-directory: lingdong-bansui-web

  miniapp:
    name: 小程序类型检查与双目标构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lingdong-bansui-miniapp/package-lock.json
      - run: npm ci
        working-directory: lingdong-bansui-miniapp
      - run: npm run type-check
        working-directory: lingdong-bansui-miniapp
      - run: npm run build:h5
        working-directory: lingdong-bansui-miniapp
      - run: npm run build:mp-weixin
        working-directory: lingdong-bansui-miniapp
